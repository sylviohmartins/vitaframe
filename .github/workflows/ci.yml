name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'chore/**']
  merge_group:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Validate
        run: npm run ci

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Browser E2E
        run: npm run e2e
      - name: Upload E2E and performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  impeccable:
    name: impeccable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
      - name: Impeccable design detector — all V1 surfaces
        run: |
          npx --yes impeccable@4.0.1 detect index.html --json > impeccable-index.json
          npx --yes impeccable@4.0.1 detect advanced.html --json > impeccable-advanced.json
          npx --yes impeccable@4.0.1 detect meals.html --json > impeccable-meals.json
          npx --yes impeccable@4.0.1 detect adaptive.html --json > impeccable-adaptive.json
      - name: Upload Impeccable reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impeccable-report
          path: impeccable-*.json
          if-no-files-found: error
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  quality-gate:
    name: quality-gate
    if: always()
    needs: [quality, e2e, impeccable, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Aggregate mandatory checks
        env:
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          IMPECCABLE: ${{ needs.impeccable.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          echo "quality=$QUALITY"
          echo "e2e=$E2E"
          echo "impeccable=$IMPECCABLE"
          echo "security=$SECURITY"
          test "$QUALITY" = success
          test "$E2E" = success
          test "$IMPECCABLE" = success
          test "$SECURITY" = success
