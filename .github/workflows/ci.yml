name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/v1-complete]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Validate
        run: npm run ci

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Browser E2E
        run: npm run e2e
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  impeccable:
    name: impeccable
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
      - name: Impeccable design detector
        run: npx --yes impeccable@4.0.1 detect index.html --json > impeccable.json
      - name: Upload Impeccable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impeccable-report
          path: impeccable.json
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: quality-gate
    if: always()
    needs: [quality, e2e, impeccable]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Aggregate mandatory checks
        env:
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          IMPECCABLE: ${{ needs.impeccable.result }}
        run: |
          echo "quality=$QUALITY"
          echo "e2e=$E2E"
          echo "impeccable=$IMPECCABLE"
          test "$QUALITY" = success
          test "$E2E" = success
          test "$IMPECCABLE" = success
