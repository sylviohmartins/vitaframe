name: Scheduled validation

on:
  schedule:
    - cron: '23 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-validation
  cancel-in-progress: true

jobs:
  extended:
    name: extended-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Static, unit, audit and build quality
        run: npm run ci
      - name: Browser E2E, accessibility, performance and visual regression
        run: npm run e2e
      - name: Impeccable detector — all V1 surfaces
        run: |
          npx --yes impeccable@4.0.1 detect index.html --json > impeccable-index.json
          npx --yes impeccable@4.0.1 detect advanced.html --json > impeccable-advanced.json
          npx --yes impeccable@4.0.1 detect adaptive.html --json > impeccable-adaptive.json
          npx --yes impeccable@4.0.1 detect meals.html --json > impeccable-meals.json
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-validation-artifacts
          path: |
            e2e-artifacts/
            impeccable-*.json
          if-no-files-found: ignore
          retention-days: 14
