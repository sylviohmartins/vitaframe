name: Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  preview:
    name: preview-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deployment.outputs.page_url }}previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Validate preview
        run: npm run ci && npm run e2e
      - name: Preserve validated preview
        run: mv dist "$RUNNER_TEMP/preview-dist"
      - name: Checkout production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: production-source
      - name: Build production root
        working-directory: production-source
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Compose Pages artifact
        run: |
          mkdir -p publish/previews/pr-${{ github.event.pull_request.number }}
          cp -a production-source/dist/. publish/
          cp -a "$RUNNER_TEMP/preview-dist/." "publish/previews/pr-${{ github.event.pull_request.number }}/"
      - name: Upload static preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitaframe-preview-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/preview-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: publish
      - name: Deploy preview without replacing production root
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Smoke test deployed preview
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}previews/pr-${{ github.event.pull_request.number }}/
        run: |
          test -n "$PREVIEW_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PREVIEW_URL" | grep -q 'VitaFrame'
