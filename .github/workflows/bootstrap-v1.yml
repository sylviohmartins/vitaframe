name: Bootstrap V1

on:
  push:
    branches: [feat/v1-complete]
    paths:
      - '.github/workflows/bootstrap-v1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1-complete
      - name: Materialize V1 snapshot
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap.tgz.b64 | tar -xzf -
          rm -f .bootstrap.tgz.b64 .github/workflows/bootstrap-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: materialize VitaFrame V1"
          git push origin HEAD:feat/v1-complete
