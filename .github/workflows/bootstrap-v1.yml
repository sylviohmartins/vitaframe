# one-time V1 materializer — diagnostic pass
name: Bootstrap V1

on:
  push:
    branches: [feat/v1-complete]
    paths:
      - '.github/workflows/bootstrap-v1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1-complete
      - name: Diagnose staged archive parts
        shell: bash
        run: |
          set -euo pipefail
          wc -c .v1part*
          sha256sum .v1part*
          cat .v1part00 .v1part01 .v1part02 .v1part03 .v1part04 .v1part05 .v1part06 .v1part07 .v1part08 .v1part09 .v1part10 .v1part11 .v1part12 > /tmp/vitaframe-v1.b64
          wc -c /tmp/vitaframe-v1.b64
          sha256sum /tmp/vitaframe-v1.b64
          exit 1
